# The node is a background agent: no web server, no inbound ports.
spring.main.web-application-type=none
spring.main.banner-mode=off
# Filled in by Maven resource filtering; overridden per release with -Dnode.version=...
node.version=@node.version@

# Everything else comes from the environment written by install.sh (/etc/scanning-node/node.env):
#   SCANNING_MANAGER_URL, SCANNING_ENROLLMENT_TOKEN,
#   SCANNING_STATE_DIR (/var/lib/scanning-node), SCANNING_APP_DIR (/opt/scanning-node),
#   SCANNING_HEARTBEAT_MS (10000), SCANNING_NMAP (nmap)

# The node trusts exactly the manager's certificate, packaged in the JAR (deploy/generate-tls-keys.sh).
spring.ssl.bundle.jks.manager.truststore.location=classpath:tls/truststore.p12
spring.ssl.bundle.jks.manager.truststore.password=changeit
spring.ssl.bundle.jks.manager.truststore.type=PKCS12
